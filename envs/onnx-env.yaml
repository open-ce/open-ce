builder_version: ">=13.0.0"

imported_envs:
{% if not s390x %}
  - tensorflow-env.yaml
{% endif %}
  - common-deps.yaml

packages:
  - feedstock : onnx
{% if not s390x %}
  - feedstock : safeint
  - feedstock : gtest
  - feedstock : libdate
  - feedstock : optional-lite
  - feedstock : boost_mp11
  - feedstock : https://github.com/conda-forge/fire-feedstock
    git_tag : a691d408ec35d71fdf9aecbed6efb408affb2b80
    patches :
      - feedstock-patches/fire/0001-Opence-changes.patch
  - feedstock : https://github.com/conda-forge/cmake-feedstock
    git_tag : 70e07324f0ab7f075c5c325a55e31ddc9b68d985
    patches :
      - feedstock-patches/cmake/0001-P10-changes.patch         #[ppc_arch == 'p10']
      - feedstock-patches/cmake/0001-Fixed-invalid-conversion-from-long-int-to-CURL_NETRC.patch
  {% if build_type == 'cuda' %}
  - feedstock : cudatoolkit
  - feedstock : cudnn
  - feedstock : nccl
  {% endif %}
  - feedstock : https://github.com/conda-forge/abseil-cpp-feedstock.git
    git_tag : 48ac432e7dcf12dcdc64248da912dbe5637fdfdd
    patches :                                                       #[ppc_arch == 'p10']
      - feedstock-patches/abseil-cpp/0001-P10-changes.patch         #[ppc_arch == 'p10']
  - feedstock : onnxruntime
  - feedstock : onnxconverter-common
  - feedstock : skl2onnx
  - feedstock : onnxmltools
  - feedstock : tf2onnx
{% endif %}
git_tag_for_env: open-ce-v1.11.8-ffmpeg-fix
