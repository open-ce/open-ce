#     - feedstock-patches/tokenizers/0001-opence-changes-for-s390x.patch               #[s390x]
  - feedstock : huggingface_hub
  - feedstock : sacremoses
  - feedstock : sentencepiece
  - feedstock : transformers
{% endif %}

